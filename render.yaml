services:
  - type: web
    name: land-in-korea-comment-bot
    runtime: python
    rootDir: services/comment-auto-reply
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ACCESS_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
