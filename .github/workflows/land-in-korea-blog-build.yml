name: Land in Korea Blog Build

# land-in-korea-blog/ 안의 글(content/posts)이 바뀌면 정적 사이트를 다시 빌드해
# site/ 산출물을 커밋합니다. GitHub Pages는 이미 main 브랜치 루트를 그대로
# 서빙하고 있어서, site/ 산출물이 커밋되는 즉시 그대로 배포됩니다.
on:
  push:
    branches: [ main ]
    paths:
      - 'land-in-korea-blog/content/**'
      - 'land-in-korea-blog/automation/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build site
        run: |
          cd land-in-korea-blog/automation
          python3 build.py

      - name: Commit built site
        run: |
          if git diff --quiet -- land-in-korea-blog/site; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "blog-bot"
          git config user.email "actions@github.com"
          git add land-in-korea-blog/site
          git commit -m "chore: rebuild Land in Korea blog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
