name: Land in Korea Daily Topic

# 매일 1회, 사람 개입 없이 다음 주제를 골라 이미지와 함께 발행 큐에 등록합니다.
# 실제 Facebook/Threads 발행은 SNS Scheduler(scheduler.yml, 15분 간격)가 이어서 처리합니다.
on:
  schedule:
    # 정각(00:00)은 전 세계 크론이 몰려 GitHub Actions 예약 실행이 지연/스킵되기 쉬운
    # 시간대라(GitHub 공식 문서 경고), 07분으로 살짝 옮겨 혼잡을 피합니다.
    - cron: '7 0 * * *'   # 매일 00:07 UTC (KST 09:07)
  workflow_dispatch:

concurrency:
  group: land-in-korea-daily-topic
  cancel-in-progress: false

jobs:
  queue-daily-topic:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Install ffmpeg (needed for Instagram background-music merge)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Top up topic bank if running low (2026-09-17, "주제가 떨어지면 자동생성")
        # topic_bank.json이 목표치(50개)보다 작으면 Claude로 "뾰족한"(결정/실수회피형)
        # 새 주제를 채운다 — 오늘 로테이션이 고르기 전에 실행해야 방금 만든 주제도
        # 바로 후보에 들어간다. 이미 충분하면 조용히 아무 것도 안 한다.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-topics.js

      - name: Pick topic, fetch image, queue post
        # 2026-09-17까지는 ANTHROPIC_API_KEY를 의도적으로 뺐었다(자동 실행 중
        # 유료 API 호출 금지, 캡션은 미리 써둔 data/sns_content_queue.json 우선
        # 사용 -> 없으면 무료 템플릿). 사용자가 "무조건 자동"을 명시적으로
        # 선택해 이제부터는 넣는다 — 이미 다른 워크플로(preview-daily-post.yml,
        # test-curated-publish.yml)가 쓰는 같은 저장소 시크릿을 재사용하므로
        # 새로 설정할 필요 없음. 이걸로 두 가지가 실제로 켜진다: (1) 캐시에 없는
        # 주제는 템플릿 대신 Claude가 실시간으로 캡션을 만들고, (2) 캡션 생성 직후
        # lib/scheduler/quality_gate.js가 발행 가능 여부를 검증해 통과하면
        # approved:true로 등록돼 사람 검수(/review) 없이 그대로 발행된다.
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOUR_AUDIO_GUIDE_API_KEY: ${{ secrets.TOUR_AUDIO_GUIDE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/daily-auto-post.js

      - name: Write blog posts for any SNS topic that doesn't have one yet
        # 위와 같은 이유로 ANTHROPIC_API_KEY 추가(2026-09-17) — 캐시에 없는
        # 블로그 글도 이제 템플릿 대신 Claude가 실시간으로 작성한다.
        env:
          BLOG_REPO_PAT: ${{ secrets.BLOG_REPO_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/sync-blog-posts.js

      - name: Commit queued post and topic state
        run: |
          if git diff --quiet -- data/queue.json data/topic_state.json data/topic_blog_links.json data/topic_bank.json; then
            echo "No new topic queued; no commit required."
            exit 0
          fi

          git config user.name "sns-automation-bot"
          git config user.email "actions@github.com"
          git add data/queue.json data/topic_state.json data/topic_blog_links.json data/topic_bank.json
          git commit -m "chore: queue daily Land in Korea topic"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify no duplicate media across posts
        # 실패해도 워크플로 전체를 빨갛게 만들지 않는다 — 이건 이미 발행 큐에 들어간
        # 것을 되돌릴 수 없으니, 조용히 놓치지 않고 로그에 남기는 감시 역할만 한다
        # (2026-09-02 사용자 요청: "검증자 역할을 할 무언가가 필요해").
        continue-on-error: true
        run: node scripts/verify-no-duplicate-media.js

      - name: Verify every topic has aligned image search terms
        # 본문(콘텐츠 각도 수)과 이미지 검색어 배열 길이가 어긋나면 seed로 고른
        # 각도와 실제로 검색되는 사진이 안 맞을 수 있다(2026-09-02 사용자 지적:
        # "본문과 영상과 이미지가 맞지 않을 수 있는데"). 새 주제를 추가할 때
        # TOPIC_QUERIES 등록을 빠뜨리는 실수를 자동으로 잡는다 — 실제로 이 스크립트를
        # 처음 돌렸을 때 기존 주제 하나가 이미 이 상태였던 걸 발견해서 고쳤다.
        continue-on-error: true
        run: node scripts/verify-topic-media-alignment.js
