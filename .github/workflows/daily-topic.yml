name: Land in Korea Daily Topic

# 매일 1회, 사람 개입 없이 다음 주제를 골라 이미지와 함께 발행 큐에 등록합니다.
# 실제 Facebook/Threads 발행은 SNS Scheduler(scheduler.yml, 15분 간격)가 이어서 처리합니다.
on:
  schedule:
    # 정각(00:00)은 전 세계 크론이 몰려 GitHub Actions 예약 실행이 지연/스킵되기 쉬운
    # 시간대라(GitHub 공식 문서 경고), 07분으로 살짝 옮겨 혼잡을 피합니다.
    - cron: '7 0 * * *'   # 매일 00:07 UTC (KST 09:07)
  workflow_dispatch:

concurrency:
  group: land-in-korea-daily-topic
  cancel-in-progress: false

jobs:
  queue-daily-topic:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Pick topic, fetch image, queue post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/daily-auto-post.js

      - name: Write blog posts for any SNS topic that doesn't have one yet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          BLOG_REPO_PAT: ${{ secrets.BLOG_REPO_PAT }}
        run: node scripts/sync-blog-posts.js

      - name: Commit queued post and topic state
        run: |
          if git diff --quiet -- data/queue.json data/topic_state.json data/topic_blog_links.json; then
            echo "No new topic queued; no commit required."
            exit 0
          fi

          git config user.name "sns-automation-bot"
          git config user.email "actions@github.com"
          git add data/queue.json data/topic_state.json data/topic_blog_links.json
          git commit -m "chore: queue daily Land in Korea topic"
          git push origin "HEAD:${GITHUB_REF_NAME}"
