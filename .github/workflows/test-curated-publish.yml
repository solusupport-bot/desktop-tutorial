name: Test Curated Multi-Platform Publish

# 실제 curateContent 큐레이션 파이프라인으로 Threads/Facebook/Instagram에
# 동시에, 플랫폼별로 다르게 재가공된 글을 즉시 발행하고 실제 URL까지 확인합니다.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: '주제명 (lib/ingestion/korea_travel.js의 topic 값)'
        required: false
        default: 'T-money transit card'
        type: string
      seed:
        description: '각도/훅 회전용 seed'
        required: false
        default: '0'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install ffmpeg (needed for Instagram background-music merge)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Publish curated topic to all platforms
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOUR_AUDIO_GUIDE_API_KEY: ${{ secrets.TOUR_AUDIO_GUIDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/publish-curated-topic.js --topic "${{ inputs.topic }}" --seed "${{ inputs.seed }}"
        shell: bash

      - name: Commit updated recent-image dedupe state
        run: |
          if git diff --quiet -- data/topic_state.json; then
            echo "No dedupe state change; no commit required."
            exit 0
          fi

          git config user.name "sns-automation-bot"
          git config user.email "actions@github.com"
          git add data/topic_state.json
          git commit -m "chore: record images used by manual curated test-publish"
          git push origin "HEAD:${GITHUB_REF_NAME}"
