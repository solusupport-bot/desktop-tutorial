name: GitHub Models probe
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call free models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for m in openai/gpt-4.1 openai/gpt-4o deepseek/DeepSeek-V3-0324 meta/Llama-4-Maverick-17B-128E-Instruct-FP8 mistral-ai/mistral-medium-2505 xai/grok-3; do
            echo "== $m"
            curl -s -w " [%{http_code}]\n" https://models.github.ai/inference/chat/completions \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Name the capital of Korea in one word.\"}],\"max_tokens\":10}" | head -c 400
          done
