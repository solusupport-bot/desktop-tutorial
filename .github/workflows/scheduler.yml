name: SNS Scheduler

on:
  schedule:
    # 정각/15분 정각(:00,:15,:30,:45)은 전 세계 크론이 몰려 GitHub Actions 예약 실행이
    # 지연/스킵되기 쉬운 시간대라(GitHub 공식 문서 경고), 07분씩 밀어서 혼잡을 피합니다.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# 동일 큐를 처리하는 실행을 겹치지 않게 해 중복 발행을 방지합니다.
concurrency:
  group: sns-scheduler-main
  cancel-in-progress: false

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'


      - run: npm ci

      - name: Run scheduler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/run-scheduler.js

      - name: Commit published queue state
        run: |
          if git diff --quiet -- data/queue.json; then
            echo "Queue unchanged; no commit required."
            exit 0
          fi

          git config user.name "sns-automation-bot"
          git config user.email "actions@github.com"
          git add data/queue.json
          git commit -m "chore: update published post queue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
