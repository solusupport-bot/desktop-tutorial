name: SNS Scheduler

on:
  schedule:
    # 2026-09-16 실측: 15분 간격(7,22,37,52)은 92.5%가 스킵됨 (실행 자체는 매번 1분
    # 안에 끝나는데도 평균 3.4시간에 한 번만 돎 — GitHub이 고빈도 schedule 이벤트를
    # 대부분 발생시키지 않는 플랫폼 자체 한계, concurrency/워크플로 로직 문제 아님).
    # 그래서 GitHub schedule은 시간당 1회로 낮춘 "기본 보장" 역할만 하고, 15분 간격
    # 정밀도는 이 PC의 Windows 작업 스케줄러가 workflow_dispatch를 직접 호출해서
    # 이중으로 보완한다 (ops/local-cron/trigger-scheduler.ps1 참고).
    - cron: '7 * * * *'
  workflow_dispatch:

# 동일 큐를 처리하는 실행을 겹치지 않게 해 중복 발행을 방지합니다.
concurrency:
  group: sns-scheduler-main
  cancel-in-progress: false

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'


      - run: npm ci

      - name: Claim due posts
        run: node scripts/claim-due-posts.js

      - name: Commit claim (this is the exclusive lock — see comment)
        # concurrency 그룹만으로는 두 실행이 겹치는 짧은 창을 완전히 막지 못한다는 게
        # 2026-09-01 실제 사고로 확인됐다(수동 재시도와 마침 그 순간 돌아온 cron이
        # 겹쳐 같은 게시글 3개가 두 번씩 발행됨). 그래서 claim(어떤 게시글을 이번
        # 실행이 처리할지 표시)과 실제 발행을 분리하고, claim 커밋의 git push 성공
        # 여부로 "소유권"을 가른다 — 이 스텝이 non-fast-forward로 실패하면(다른 실행이
        # 이미 같은 항목들을 claim해서 먼저 푸시함) 워크플로가 여기서 바로 멈추고
        # 다음 "Publish claimed posts" 스텝은 아예 실행되지 않는다. git push 실패는
        # 100% 안전하게 막을 수 있지만, Threads/Facebook/Instagram API 호출은 한 번
        # 나가면 되돌릴 수 없으므로 반드시 발행 *이전에* 이 지점에서 걸러야 한다.
        run: |
          if git diff --quiet -- data/queue.json; then
            echo "No due posts to claim; nothing to do."
            exit 0
          fi

          git config user.name "sns-automation-bot"
          git config user.email "actions@github.com"
          git add data/queue.json
          git commit -m "chore: claim due posts for publishing"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish claimed posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          TUMBLR_BLOG_IDENTIFIER: ${{ secrets.TUMBLR_BLOG_IDENTIFIER }}
        run: node scripts/publish-claimed-posts.js

      - name: Commit published queue state
        run: |
          if git diff --quiet -- data/queue.json; then
            echo "Queue unchanged; no commit required."
            exit 0
          fi

          git config user.name "sns-automation-bot"
          git config user.email "actions@github.com"
          git add data/queue.json
          git commit -m "chore: update published post queue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
