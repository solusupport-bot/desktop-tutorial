name: Check Threads Keyword Search Permission

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: '테스트할 검색어'
        required: false
        default: 'eSIM'
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Check keyword_search
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/check-keyword-search.js "${{ inputs.keyword }}"
        shell: bash
