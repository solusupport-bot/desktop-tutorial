name: Lookup Duplicate Posts (diagnostic)

# 일회성 진단: 2026-09-01 스케줄러 중복 발행 사고로 생긴 게시물 6개의 실제 URL을 조회.
on:
  workflow_dispatch:

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Lookup permalinks
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/lookup-duplicate-posts.js
