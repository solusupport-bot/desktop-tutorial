name: Test Video Publish (Threads/Facebook/Instagram)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '주제명 (lib/ingestion/korea_travel.js의 topic 값)'
        required: false
        default: 'Airport transfer options'
        type: string
      seed:
        description: '각도/훅 회전용 seed'
        required: false
        default: '0'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install ffmpeg (needed for Instagram background-music merge)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Publish video test to all platforms
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/publish-video-test.js "${{ inputs.topic }}" "${{ inputs.seed }}"
        shell: bash
